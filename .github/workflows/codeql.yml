name: CodeQL Advanced

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * 2'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      # actions/checkout v7, pinned to its verified release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # github/codeql-action v4, pinned to its verified release commit.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: "/language:${{matrix.language}}"
