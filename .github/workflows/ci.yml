name: CI PSP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Rust engine, layout, audio, and Python tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v4.2.2, pinned to its verified commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-python v5.6.0, pinned to its verified commit.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.3'

      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-psp.txt

      - name: Compile the story from the tracked source assets
        run: python tools/compile_story.py

      - name: Test Rust engine and layout
        run: cargo test --lib --locked --no-default-features

      - name: Test PSP audio, playback, and persistence on the host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($taskModule in @('audio_blocks', 'playback', 'persistence')) {
            $taskTestExe = Join-Path $env:RUNNER_TEMP "starryflowers-$taskModule-tests.exe"
            rustc --edition=2021 --test "psp/src/$taskModule.rs" -o $taskTestExe
            if ($LASTEXITCODE -ne 0) { throw "Rust $taskModule test compilation failed." }
            & $taskTestExe
            if ($LASTEXITCODE -ne 0) { throw "Rust $taskModule tests failed." }
          }

      - name: Test Python PSP pipeline and texture helpers
        run: python -m unittest discover -s tools -p 'test_psp*.py'

      - name: Test GU stack bounds and debug pixel writes on the host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskTestExe = Join-Path $env:RUNNER_TEMP 'starryflowers-gu-state-tests.exe'
          rustc --edition=2018 --test third_party/psp/src/sys/gu_state.rs -o $taskTestExe
          if ($LASTEXITCODE -ne 0) { throw 'GU test compilation failed.' }
          & $taskTestExe
          if ($LASTEXITCODE -ne 0) { throw 'GU tests failed.' }

  psp-build:
    name: Build and verify the complete PSP ISO and homebrew
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # actions/checkout v4.2.2, pinned to its verified commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.3'

      - name: Install pinned asset conversion and packaging dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-psp.txt

      - name: Install pinned PSP Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install nightly-2026-10-05-x86_64-pc-windows-gnu --profile minimal --component rust-src
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the pinned PSP Rust toolchain.' }
          cargo install cargo-psp --version 0.2.9 --locked
          if ($LASTEXITCODE -ne 0) { throw 'Could not install cargo-psp 0.2.9.' }

      - name: Build ISO, verify resources, and prepare release files
        shell: pwsh
        run: ./tools/ci-psp-build.ps1

      # actions/upload-artifact v4.6.2.
      - name: Upload playable PSP packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: StarryFlowers-PSP
          path: |
            psp/dist/StarryFlowers.iso
            psp/dist/StarryFlowers-homebrew.zip
            psp/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach verified packages to a draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, psp-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/download-artifact v4.3.0.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: StarryFlowers-PSP
          path: release-assets

      - name: Create or update the draft release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt; then
            if [ "$(cat release-state.txt)" != true ]; then
              echo 'Refusing to replace assets on an already published release.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" StarryFlowers.iso StarryFlowers-homebrew.zip SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" StarryFlowers.iso StarryFlowers-homebrew.zip SHA256SUMS.txt \
              --verify-tag --draft --title "Starry Flowers PSP $RELEASE_TAG" --generate-notes
          fi
